<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量下载进度 - 小说爬虫系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 20px;
            color: white;
        }
        .header h1 {
            margin-bottom: 10px;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.3);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 20px;
            color: #eee;
        }
        .card-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #667eea;
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }
        .stat-item {
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        .progress-bar {
            background: #0f3460;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }
        .current-novel {
            background: #0f3460;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-size: 14px;
        }
        .log-container {
            background: #0a0e27;
            border-radius: 16px;
            overflow: hidden;
        }
        .log-header {
            background: #16213e;
            padding: 15px 20px;
            border-bottom: 1px solid #2a3a5a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-header h3 {
            color: #eee;
        }
        .clear-btn {
            background: #e94560;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .log-content {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            background: #0a0e27;
        }
        .log-entry {
            color: #aaa;
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
            word-break: break-all;
        }
        .log-entry.success {
            color: #4ade80;
        }
        .log-entry.error {
            color: #f87171;
        }
        .log-entry.info {
            color: #60a5fa;
        }
        .novel-list {
            margin-top: 20px;
            background: #16213e;
            border-radius: 16px;
            overflow: hidden;
        }
        .novel-list-header {
            padding: 15px 20px;
            background: #0f3460;
            font-weight: bold;
            color: #eee;
        }
        .novel-items {
            max-height: 300px;
            overflow-y: auto;
        }
        .novel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #2a3a5a;
            font-size: 14px;
        }
        .novel-name {
            color: #ddd;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .novel-status {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending {
            background: #6c757d;
            color: white;
        }
        .status-success {
            background: #10b981;
            color: white;
        }
        .status-failed {
            background: #ef4444;
            color: white;
        }
        .status-running {
            background: #f59e0b;
            color: white;
        }
        .refresh-info {
            font-size: 12px;
            color: #888;
            margin-top: 20px;
            text-align: center;
        }
        button {
            background: #667eea;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #5a67d8;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-running { background: #f59e0b; }
        .status-finished { background: #10b981; }
        .status-error { background: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 批量下载任务</h1>
            <div id="taskInfo"></div>
            <div class="nav-links">
                <a href="/batch">➕ 新建批量任务</a>
                <a href="/">🏠 单本下载</a>
                <a href="/library">📖 小说库</a>
                <a href="/batch_list">📋 任务列表</a>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <div class="card-title">📊 下载进度</div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总计</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedCount">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="failedCount">0</div>
                        <div class="stat-label">失败</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="current-novel" id="currentNovel">
                    等待开始...
                </div>
            </div>

            <div class="card">
                <div class="card-title">ℹ️ 任务信息</div>
                <div><strong>作者：</strong> <span id="authorName"></span></div>
                <div><strong>作者页面：</strong> <a id="authorUrl" href="#" target="_blank" style="color:#667eea"></a></div>
                <div><strong>增量模式：</strong> <span id="incrementalMode"></span></div>
                <div><strong>开始时间：</strong> <span id="startTime"></span></div>
                <div><strong>状态：</strong> <span id="statusBadge"></span></div>
                <div style="margin-top: 15px;">
                    <button onclick="location.reload()">🔄 刷新</button>
                    <button onclick="window.location.href='/batch_list'">📋 返回列表</button>
                </div>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <h3>📝 实时日志</h3>
                <button class="clear-btn" onclick="clearLogDisplay()">清空显示</button>
            </div>
            <div class="log-content" id="logContent">
                <div class="log-entry">加载中...</div>
            </div>
        </div>

        <div class="novel-list">
            <div class="novel-list-header">📚 小说列表</div>
            <div class="novel-items" id="novelList">
                <div style="padding: 20px; text-align: center; color: #888;">加载中...</div>
            </div>
        </div>

        <div class="refresh-info">
            页面每 2 秒自动刷新
        </div>
    </div>

    <script>
        const batchId = "{{ batch_id }}";
        let autoRefresh = true;

        function getStatusClass(status) {
            switch(status) {
                case 'success': return 'status-success';
                case 'failed': return 'status-failed';
                case 'running': return 'status-running';
                default: return 'status-pending';
            }
        }

        function getStatusText(status) {
            switch(status) {
                case 'success': return '✓ 成功';
                case 'failed': return '✗ 失败';
                case 'running': return '⏳ 下载中';
                default: return '⏸ 等待';
            }
        }

        function fetchStatus() {
            fetch(`/api/batch_logs/${batchId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                        return;
                    }

                    // 更新统计
                    document.getElementById('totalCount').innerText = data.total || 0;
                    document.getElementById('completedCount').innerText = data.completed || 0;
                    document.getElementById('failedCount').innerText = data.failed || 0;

                    const percent = data.total > 0 ? ((data.completed + data.failed) / data.total * 100) : 0;
                    document.getElementById('progressFill').style.width = percent + '%';

                    // 当前小说
                    if (data.current_novel && data.status === 'running') {
                        document.getElementById('currentNovel').innerHTML = 
                            `📖 正在下载第 ${data.current_index}/${data.total} 本：<strong>${data.current_novel}</strong>`;
                    } else if (data.status === 'finished') {
                        document.getElementById('currentNovel').innerHTML = '✅ 批量任务已完成！';
                    } else if (data.status === 'error') {
                        document.getElementById('currentNovel').innerHTML = `❌ 任务出错：${data.error || '未知错误'}`;
                    } else {
                        document.getElementById('currentNovel').innerHTML = '等待开始...';
                    }

                    // 状态徽章
                    const statusMap = {
                        'running': '<span class="status-badge status-running">运行中</span>',
                        'finished': '<span class="status-badge status-finished">已完成</span>',
                        'error': '<span class="status-badge status-error">出错</span>'
                    };
                    document.getElementById('statusBadge').innerHTML = statusMap[data.status] || '<span class="status-badge status-pending">未知</span>';

                    // 更新日志
                    if (data.log && data.log.length > 0) {
                        const logHtml = data.log.map(entry => {
                            let className = 'log-entry';
                            if (entry.includes('✓') || entry.includes('完成')) className += ' success';
                            if (entry.includes('✗') || entry.includes('失败')) className += ' error';
                            if (entry.includes('---') || entry.includes('开始下载')) className += ' info';
                            return `<div class="${className}">${escapeHtml(entry)}</div>`;
                        }).join('');
                        const logContainer = document.getElementById('logContent');
                        logContainer.innerHTML = logHtml;
                        logContainer.scrollTop = logContainer.scrollHeight;
                    }

                    // 更新小说列表
                    if (data.novels && data.novels.length > 0) {
                        const novelsHtml = data.novels.map((novel, idx) => {
                            let statusClass = getStatusClass(novel.status);
                            let statusText = getStatusText(novel.status);
                            if (data.current_index === idx + 1 && data.status === 'running') {
                                statusClass = 'status-running';
                                statusText = '⏳ 下载中';
                            }
                            return `
                                <div class="novel-item">
                                    <span class="novel-name">${idx+1}. ${escapeHtml(novel.name)}</span>
                                    <span class="novel-status ${statusClass}">${statusText}</span>
                                </div>
                            `;
                        }).join('');
                        document.getElementById('novelList').innerHTML = novelsHtml;
                    }

                    // 任务信息
                    if (data.author_name) {
                        document.getElementById('authorName').innerHTML = escapeHtml(data.author_name);
                    } else {
                        document.getElementById('authorName').innerHTML = '未知';
                    }
                })
                .catch(error => {
                    console.error('获取状态失败:', error);
                });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogDisplay() {
            document.getElementById('logContent').innerHTML = '';
        }

        // 初始加载
        fetchStatus();

        // 自动刷新
        setInterval(() => {
            if (autoRefresh) {
                fetchStatus();
            }
        }, 2000);
    </script>
</body>
</html>
